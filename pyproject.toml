[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odcv-bench"
version = "1.0.0"
description = "ODCV-Bench: outcome-driven constraint violations in autonomous agents, as an Inspect AI task"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["inspect-ai>=0.3.100"]

[project.urls]
Homepage = "https://github.com/McGill-DMaS/ODCV-Bench"
Paper = "https://arxiv.org/abs/2512.20798"

[project.entry-points.inspect_ai]
odcv_bench = "odcv_bench._registry"

[tool.setuptools]
packages = ["odcv_bench"]
